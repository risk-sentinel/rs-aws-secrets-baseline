# Per-control partition applicability — auditor-facing flat table.
# Values per partition: applicable | not_applicable | partial
# `reason` is required when not_applicable or partial.
# Keep this file in sync with `tag applicable_partitions:` on each control.
#
# All controls target AWS Commercial (aws) and AWS GovCloud non-DoD
# (aws-us-gov). Secrets Manager, KMS, CloudTrail and interface VPC
# endpoints exist in both partitions. The one partition nuance is
# cross-region replication (SEC-4.1): Secrets Manager replication does
# not cross partitions, so a GovCloud consumer replicates within
# aws-us-gov only — still applicable, documented per-control.

controls:
  - id: SEC-1.1
    title: "Automatic rotation enabled"
    aws: applicable
    aws-us-gov: applicable
    reason: ''
  - id: SEC-1.2
    title: "Rotation interval within max window"
    aws: applicable
    aws-us-gov: applicable
    reason: ''
  - id: SEC-1.3
    title: "Last rotation within max window"
    aws: applicable
    aws-us-gov: applicable
    reason: ''
